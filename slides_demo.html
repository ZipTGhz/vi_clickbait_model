<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Slide Thuyết Trình — Phát hiện & Giải thích Tin Giật Tít Tiếng Việt</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --accent-green: #4ade80;
      --accent-red: #f87171;
      --accent-amber: #fbbf24;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg-dark);
      color: var(--text-main);
      font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    /* HEADER NAVIGATION */
    .deck-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 28px;
      background: rgba(15, 23, 42, 0.9);
      border-bottom: 1px solid var(--border);
    }
    .part-tag {
      background: rgba(56, 189, 248, 0.15);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.35);
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 700;
      letter-spacing: 0.4px;
    }
    .slide-pills {
      display: flex;
      gap: 6px;
    }
    .pill-btn {
      width: 30px;
      height: 28px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
    }
    .pill-btn.active {
      background: #2563eb;
      color: #fff;
      border-color: var(--primary);
      transform: scale(1.06);
    }
    /* MAIN STAGE */
    .deck-stage {
      flex: 1;
      max-width: 1240px;
      width: 100%;
      margin: 0 auto;
      padding: 28px 36px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow-y: auto;
    }
    .slide-title {
      font-size: 30px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 6px;
      line-height: 1.25;
    }
    .slide-subtitle {
      font-size: 16px;
      color: var(--primary);
      font-weight: 600;
      margin-bottom: 22px;
    }
    .slide-grid {
      display: grid;
      grid-template-columns: 1.25fr 1fr;
      gap: 24px;
      align-items: stretch;
    }
    .slide-grid.full {
      grid-template-columns: 1fr;
    }
    .card-panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 22px 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .bullet-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .bullet-list li {
      font-size: 15.5px;
      line-height: 1.55;
      color: #e2e8f0;
      padding-left: 14px;
      border-left: 3px solid var(--primary);
    }
    .kpi-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 20px;
    }
    .kpi-box {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      text-align: center;
    }
    .kpi-val {
      font-size: 20px;
      font-weight: 800;
      color: var(--accent-green);
    }
    .kpi-lbl {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 3px;
    }
    .visual-panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    .visual-panel img {
      max-width: 100%;
      max-height: 320px;
      border-radius: 10px;
      object-fit: contain;
      background: #fff;
      padding: 6px;
    }
    .visual-caption {
      font-size: 12.5px;
      color: var(--text-muted);
      margin-top: 10px;
    }
    table.bench-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13.5px;
      text-align: left;
    }
    table.bench-table th, table.bench-table td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
    }
    table.bench-table th {
      color: var(--primary);
      font-weight: 700;
      background: rgba(15, 23, 42, 0.5);
    }
    /* FOOTER */
    .deck-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 28px;
      background: rgba(15, 23, 42, 0.95);
      border-top: 1px solid var(--border);
      font-size: 13.5px;
    }
    .speaker-note {
      color: var(--accent-amber);
      font-weight: 600;
    }
    .nav-btns {
      display: flex;
      gap: 10px;
    }
    .btn-nav {
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: #fff;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }
    .btn-nav.primary {
      background: #2563eb;
      border-color: var(--primary);
    }
    .btn-nav:hover { filter: brightness(1.15); }
  </style>
</head>

          "<b>Hạn chế thực tế:</b> (1) Các trang chủ báo chỉ hiển thị tiêu đề không kèm Sapo khiến độ chính xác giảm về mức cấu hình <code>Only Title</code> (~78.95%); (2) Các câu giật tít ẩn dụ sâu (<i>Curiosity Gap</i> không dùng từ khóa cảm thán) vẫn gây False Negative; (3) Hiện tượng các báo đăng lại cùng bản tin cần kiểm chứng thêm bằng <b>Source Holdout</b>.",
          "<b>Hướng phát triển:</b> Bổ sung đánh giá chéo theo nguồn báo (<i>Leave-One-Source-Out</i>), tích hợp cơ chế tiền tải ngầm Sapo ở trang chủ và tinh chỉnh mô hình ngôn ngữ nhỏ cho tác vụ viết lại tiêu đề."
        ],
        kpi: [
          { val: "4 Đóng góp", lbl: "Data · Model · XAI · Extension" },
          { val: "3 Hạn chế", lbl: "Phân tích thẳng thắn từ thực nghiệm" },
          { val: "Q & A", lbl: "Cảm ơn & Lắng nghe Hội đồng" }
        ],
        visualHtml: `
          <div style="padding:24px;text-align:center;">
            <div style="font-size:42px;margin-bottom:10px;">🛡️🇻🇳</div>
            <div style="font-size:21px;font-weight:800;color:#4ade80;margin-bottom:8px;">CẢM ƠN THẦY CÔ & HỘI ĐỒNG ĐÃ LẮNG NGHE!</div>
            <div style="font-size:13.5px;color:#cbd5e1;line-height:1.6;">
              Toàn bộ mã nguồn, trọng số mô hình, dữ liệu kiểm thử và Chrome Extension<br>đã sẵn sàng phục vụ kiểm tra và phản biện trực tiếp.
            </div>
          </div>
        `,
        note: "Thông điệp: Tổng kết trung thực kết quả đạt được, nhìn nhận thẳng thắn các hạn chế học thuật và đề xuất hướng giải quyết trực tiếp."
      }
    ];

    let idx = 0;
    const hdrPart = document.getElementById("hdr-part");
    const hdrCount = document.getElementById("hdr-count");
    const hdrPills = document.getElementById("hdr-pills");
    const stage = document.getElementById("stage");
    const ftrNote = document.getElementById("ftr-note");
    const btnPrev = document.getElementById("btn-prev");
    const btnNext = document.getElementById("btn-next");

    function render() {
      const s = SLIDES[idx];
      hdrPart.textContent = s.part;
      hdrCount.textContent = `Slide ${idx + 1} / ${SLIDES.length}`;
      ftrNote.textContent = `🎤 Gợi ý thuyết trình: ${s.note}`;

      hdrPills.innerHTML = "";
      SLIDES.forEach((_, i) => {
        const b = document.createElement("button");
        b.className = `pill-btn ${i === idx ? "active" : ""}`;
        b.textContent = i + 1;
        b.onclick = () => { idx = i; render(); };
        hdrPills.appendChild(b);
      });

      const bullets = s.bullets.map(item => `<li>${item}</li>`).join("");
      const kpis = s.kpi
        .map(k => `<div class="kpi-box"><div class="kpi-val">${k.val}</div><div class="kpi-lbl">${k.lbl}</div></div>`)
        .join("");

      let rightContent = "";
      if (s.img) {
        rightContent = `
          <div class="visual-panel">
            <img src="${s.img}" alt="Slide chart" />
            <div class="visual-caption">${s.caption || ""}</div>
          </div>
        `;
      } else if (s.visualHtml) {
        rightContent = `<div class="visual-panel">${s.visualHtml}</div>`;
      }

      stage.innerHTML = `
        <div class="slide-title">${s.title}</div>
        <div class="slide-subtitle">${s.subtitle}</div>
        <div class="slide-grid ${rightContent ? "" : "full"}">
          <div class="card-panel">
            <ul class="bullet-list">${bullets}</ul>
            <div class="kpi-row">${kpis}</div>
          </div>
          ${rightContent}
        </div>
      `;

      btnPrev.disabled = idx === 0;
      btnPrev.style.opacity = idx === 0 ? "0.4" : "1";
      btnNext.disabled = idx === SLIDES.length - 1;
      btnNext.style.opacity = idx === SLIDES.length - 1 ? "0.4" : "1";
    }

    btnPrev.onclick = () => { if (idx > 0) { idx--; render(); } };
    btnNext.onclick = () => { if (idx < SLIDES.length - 1) { idx++; render(); } };

    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight" || e.key === " ") btnNext.click();
      if (e.key === "ArrowLeft") btnPrev.click();
      if (e.key.toLowerCase() === "f") toggleFullScreen();
    });

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen();
      }
    }

    render();
  </script>
</body>
</html>
